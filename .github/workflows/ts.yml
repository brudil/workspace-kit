name: TypeScript kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]  # 22.18 is the oldest that runs .ts as it is
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # What a release would publish: the files, and that it packs.
      - run: npm pack --dry-run

      - name: The example registers what it declares
        run: node examples/hello/main.ts --registration > /dev/null
